# ============================================================
# SHINEGUARD: Block PHPMyAdmin from Public Internet (AWS)
# ============================================================
#
# INSTRUCTIONS — Run these commands on your AWS EC2 server:
#
# 1. SSH into your AWS server:
#    ssh -i your-key.pem ec2-user@your-aws-ip
#
# 2. Open Apache config:
#    sudo nano /etc/httpd/conf/httpd.conf
#    (or: sudo nano /opt/lampp/etc/httpd.conf on XAMPP)
#
# 3. Add this block at the bottom:
# ============================================================

<Directory "/opt/lampp/phpmyadmin">
    # Only allow access from localhost (the server itself)
    # This means NOBODY from the internet can open PHPMyAdmin
    Require ip 127.0.0.1
    Require ip ::1
</Directory>

# For non-XAMPP Apache (ubuntu/amazon linux):
# <Directory "/usr/share/phpmyadmin">
#     Require ip 127.0.0.1
# </Directory>

# ============================================================
# 4. Restart Apache:
#    sudo systemctl restart httpd
#    (or: sudo /opt/lampp/lampp restart)
#
# 5. To access PHPMyAdmin when needed (SSH Tunnel):
#    ssh -L 8080:localhost/phpmyadmin your-server
#    Then open: http://localhost:8080
#
# RESULT: Even with admin credentials, the pen tester
# cannot reach PHPMyAdmin from outside the server.
# ============================================================

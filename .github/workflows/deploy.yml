name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy ShineGuard
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/html/ShineGuard
            sudo git fetch --all
            sudo git reset --hard origin/main
            sudo chown -R www-data:www-data /var/www/html/ShineGuard
            sudo chmod -R 755 /var/www/html/ShineGuard
            sudo chmod -R 775 /var/www/html/ShineGuard/snapshots
            echo "✅ Deployment complete at $(date)"

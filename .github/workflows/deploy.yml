name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy ShineGuard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          sync: true
          command_timeout: 10m
          script: |
            echo "🛠️ Starting Deployment Sync..."
            cd /var/www/html/ShineGuard || exit 1
            
            # Gain control of the repository
            sudo chown -R ubuntu:ubuntu /var/www/html/ShineGuard
            
            # Clean Slate Sync
            echo "📥 Fetching and Cleaning Repository..."
            git fetch --all --prune
            git clean -fd
            git reset --hard origin/main
            
            # --- DEPENDENCY MANAGEMENT ---
            if [ -f "composer.json" ]; then
                echo "📦 Installing Dependencies (Composer)..."
                # Ensure composer is run as the web user or with correct permissions
                composer install --no-dev --optimize-autoloader --no-interaction || {
                    echo "⚠️ Composer failed. Attempting with sudo..."
                    sudo composer install --no-dev --optimize-autoloader --no-interaction
                }
            fi
            
            # Restore Permissions for Web Server
            echo "🛡️ Finalizing Permissions..."
            sudo chown -R www-data:www-data /var/www/html/ShineGuard
            sudo chmod -R 755 /var/www/html/ShineGuard
            sudo chmod -R 775 /var/www/html/ShineGuard/snapshots
            
            echo "✅ Deployment complete at $(date)"
            ls -la | head -n 20

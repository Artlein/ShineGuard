name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy ShineGuard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          sync: true
          command_timeout: 10m
          script: |
            echo "🛠️ Starting Deployment Sync..."
            cd /var/www/html/ShineGuard || exit 1
            
            # Gain control of the repository
            sudo chown -R ubuntu:ubuntu /var/www/html/ShineGuard
            
            # Clean Slate Sync
            echo "📥 Fetching and Cleaning Repository..."
            git fetch --all --prune
            git clean -fd
            git reset --hard origin/main
            
            # --- DEPENDENCY MANAGEMENT ---
            if [ -f "composer.json" ]; then
                echo "📦 Dependency Discovery: Initializing Composer..."
                
                # Check for global composer or local phar
                if ! command -v composer &> /dev/null; then
                    echo "⚠️ Global composer NOT found. Checking for composer.phar..."
                    if [ ! -f "composer.phar" ]; then
                        echo "📥 Downloading composer.phar fallback..."
                        curl -sS https://getcomposer.org/installer | php
                    fi
                    COMPOSER_BIN="php composer.phar"
                else
                    COMPOSER_BIN="composer"
                fi

                echo "🚀 Running $COMPOSER_BIN install..."
                $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction || {
                    echo "⚠️ Regular install failed. Attempting with sudo..."
                    sudo $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction --allow-plugins
                }
            fi
            
            # Restore Permissions for Web Server
            echo "🛡️ Finalizing Permissions..."
            sudo chown -R www-data:www-data /var/www/html/ShineGuard
            sudo chmod -R 755 /var/www/html/ShineGuard
            sudo chmod -R 775 /var/www/html/ShineGuard/snapshots
            
            echo "✅ Deployment complete at $(date)"
            ls -la | head -n 20
